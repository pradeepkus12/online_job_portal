{% load static %}
{% block body %}

{% include 'navigation.html' %}

<style>

body{
    background:#f4f7fc;
    font-family:Arial, Helvetica, sans-serif;
}

/* Main Container */
.forgot-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:75vh;
}

/* Card */
.forgot-card{
    width:650px;
    background:#ffffff;
    padding:45px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
}

/* Title */
.forgot-title{
    text-align:center;
    color:#0d6efd;
    font-size:42px;
    font-weight:bold;
    margin-bottom:35px;
}

.forgot-title i{
    margin-right:12px;
}

/* Label */
.form-label{
    font-size:20px;
    font-weight:bold;
    color:#14213d;
    margin-bottom:10px;
}

/* Input */
.form-control{
    height:58px;
    border-radius:12px;
    border:1px solid #d5dce8;
    font-size:18px;
    padding:15px 18px;
}

.form-control:focus{
    border-color:#0d6efd;
    box-shadow:0 0 10px rgba(13,110,253,.25);
}

/* Button */
.otp-btn{
    width:100%;
    height:58px;
    margin-top:25px;
    border:none;
    border-radius:12px;
    background:#0d6efd;
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.otp-btn:hover{
    background:#084298;
    transform:translateY(-2px);
}

/* Back */
.back-login{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#0d6efd;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.back-login:hover{
    text-decoration:underline;
}

</style>


<div class="forgot-container">

    <div class="forgot-card">

        <h2 class="forgot-title">
            <i class="fa fa-unlock-alt"></i>
            Forgot Password
        </h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    <i class="fa fa-user"></i>
                    Username / Email
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your registered username or email"
                    required
                >

            </div>


            <button type="submit" class="otp-btn">

                <i class="fa fa-paper-plane"></i>
                Send OTP

            </button>

        </form>


        <a href="{% url 'user_login' %}" class="back-login">

            <i class="fa fa-arrow-left"></i>
            Back to Login

        </a>

    </div>

</div>


{% if messages %}

<script>

{% for message in messages %}

alert("{{ message|escapejs }}");

{% endfor %}

</script>

{% endif %}


{% endblock %}
