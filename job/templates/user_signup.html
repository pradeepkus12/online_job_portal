{% load static %}
{% block body %}

{% include 'user_navigation.html' %}

<style>
body{
    background:#f4f7fc;
    font-family:Arial, Helvetica, sans-serif;
}

.signup-marquee{
    background:#198754;
    color:white;
    font-size:22px;
    font-weight:bold;
    padding:10px;
    border-radius:5px;
    margin:20px;
}

.signup-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
}

.signup-form{
    width:500px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.signup-title{
    text-align:center;
    color:#198754;
    margin-bottom:25px;
    font-weight:bold;
}

.form-control{
    height:45px;
    border-radius:8px;
}

.signup-btn{
    width:100%;
    height:45px;
    background:#198754;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
}

.signup-btn:hover{
    background:#146c43;
}

.login-link{
    text-align:center;
    margin-top:15px;
}

.gender-group{
    display:flex;
    gap:20px;
    margin-top:8px;
}

.gender-group label{
    font-size:16px;
    font-weight:500;
    cursor:pointer;
}

.gender-group input[type="radio"]{
    margin-right:6px;
    transform:scale(1.2);
    accent-color:#198754;
}
.form-control[type="file"]{
    height:auto;
    padding:10px;
    border-radius:8px;
    border:1px solid #ced4da;
}

.form-control[type="file"]:focus{
    border-color:#198754;
    box-shadow:0 0 8px rgba(25,135,84,.3);
}
</style>
<script>
function checkpass() {
    if (document.signup.pwd.value != document.signup.cpwd.value) {
        alert("Password and Confirm Password do not match.");
        document.signup.cpwd.focus();
        return false;
    }
    return true;
}
</script>

<marquee class="signup-marquee">
    👤 Welcome to User Registration Portal
</marquee>

<div class="signup-container">

<form name="signup" method="POST" onsubmit="return checkpass();" class="signup" enctype="multipart/form-data">
     {% csrf_token %}
    <h2 class="signup-title">
        <i class="fa fa-user-plus"></i> Create Account
    </h2>

    <div class="mb-3">
        <label>Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Enter Full Name" required>
    </div>

    <div class="mb-3">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
    </div>

    <div class="mb-3">
        <label>Mobile Number</label>
        <input type="text" name="mobile" class="form-control" placeholder="Enter Mobile Number" required>
    </div>

    <div class="mb-3">
    <label class="form-label">
        <i class="fa fa-venus-mars"></i> Gender
    </label>
    <br>

    <div class="gender-group">
        <label>
            <input type="radio" name="gender" value="Male" required>
            Male
        </label>

        <label>
            <input type="radio" name="gender" value="Female">
            Female
        </label>

        <label>
            <input type="radio" name="gender" value="Other">
            Other
        </label>
    </div>
    </div> 

    <div class="mb-3">
        <label class="form-label">
            <i class="fa fa-image"></i> Profile Image
        </label>

        <input type="file"
               name="image"
               class="form-control"
               accept="image/*"
               required>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" name="pwd" class="form-control" placeholder="Enter Password" required>
    </div>

    <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" name="cpwd" class="form-control" placeholder="Confirm Password" required>
    </div>

    <button type="submit" class="signup-btn">
        <i class="fa fa-user-plus"></i> Create Account
    </button>

    <div class="login-link">
        Already have an account?
        <a href="{% url 'user_signup' %}">Login</a>
    </div>

</form>


{% if error %}
    {% if error == "no" %}
    <script>
        alert("Signup Successful");
        window.location.href = "{% url 'user_login' %}";
    </script>
    {% endif %}

    {% if error == "yes" %}
    <script>
        alert("Something went wrong. Try again...");
        window.location.href = "{% url 'user_signup' %}";
    </script>
    {% endif %}
{% endif %}
    

{% endblock %}
