{% load static %}

{% block body %}

{% include 'admin_navigation.html' %}

<style>

    body {
        background: #f4f7fc;
        font-family: Arial, Helvetica, sans-serif;
    }

    .password-container {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .password-card {
        width: 500px;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, .2);
    }

    .password-title {
        text-align: center;
        color: #2563eb;
        margin-bottom: 25px;
        font-weight: bold;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    .form-control {
        width: 100%;
        height: 45px;
        border-radius: 8px;
        border: 1px solid #ced4da;
        padding: 0 12px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .form-control:focus {
        border-color: #2563eb;
        outline: none;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    .btn-password {
        width: 100%;
        height: 45px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-password:hover {
        background: #1d4ed8;
    }

    .password-info {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .password-info p {
        margin: 7px 0;
        color: #555;
    }

    .alert {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .alert-success {
        background: #d1fae5;
        color: #065f46;
    }

    .alert-error {
        background: #fee2e2;
        color: #991b1b;
    }

</style>


<div class="password-container">

    <div class="password-card">

        <h2 class="password-title">
            <i class="fa fa-key"></i>
            Change Password
        </h2>


        <!-- Messages -->

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

 
        
        <!-- Admin Information -->

        <div class="password-info">

            <p>
                <strong>
                    <i class="fa fa-user"></i>
                    Name:
                </strong>

                {{ request.user.username }}
            </p>

            <p>
                <strong>
                    <i class="fa fa-envelope"></i>
                    Email:
                </strong>

                {{ request.user.email }}
            </p>

        </div>


        <!-- Change Password Form -->

        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    <i class="fa fa-lock"></i>
                    Old Password
                </label>

                <input
                    type="password"
                    name="old_password"
                    class="form-control"
                    placeholder="Enter old password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    <i class="fa fa-key"></i>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    class="form-control"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    <i class="fa fa-check-circle"></i>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    required
                >

            </div>


            <button type="submit" class="btn-password">

                <i class="fa fa-save"></i>
                Change Password

            </button>

        </form>

    </div>

</div>


{% endblock %}
