{% load static %}
{% block body %}

{% include 'navigation.html' %}

<style>

body{
    background:#f4f7fc;
    font-family:Arial, Helvetica, sans-serif;
}

.reset-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:75vh;
}

.reset-card{
    width:600px;
    background:white;
    padding:45px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.reset-title{
    text-align:center;
    color:#0d6efd;
    font-size:40px;
    font-weight:bold;
    margin-bottom:35px;
}

.form-label{
    font-size:19px;
    font-weight:bold;
    color:#14213d;
}

.form-control{
    height:58px;
    border-radius:12px;
    font-size:18px;
}

.reset-btn{
    width:100%;
    height:58px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:#198754;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.reset-btn:hover{
    background:#146c43;
}

</style>


<div class="reset-container">

    <div class="reset-card">

        <h2 class="reset-title">

            <i class="fa fa-lock"></i>
            Set New Password

        </h2>


        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    <i class="fa fa-lock"></i>
                    New Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    <i class="fa fa-lock"></i>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    required
                >

            </div>


            <button type="submit" class="reset-btn">

                <i class="fa fa-save"></i>
                Reset Password

            </button>

        </form>

    </div>

</div>


{% if messages %}

<script>

{% for message in messages %}

alert("{{ message|escapejs }}");

{% endfor %}

</script>

{% endif %}


{% endblock %}
