{% load static %}
{% block body %}

{% include 'navigation.html' %}

<style>

body{
    background:#f4f7fc;
    font-family:Arial, Helvetica, sans-serif;
}

.otp-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:75vh;
}

.otp-card{
    width:600px;
    background:white;
    padding:45px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.otp-title{
    text-align:center;
    color:#0d6efd;
    font-size:40px;
    font-weight:bold;
    margin-bottom:20px;
}

.otp-info{
    text-align:center;
    color:#555;
    font-size:17px;
    margin-bottom:30px;
}

.form-control{
    height:60px;
    border-radius:12px;
    font-size:22px;
    text-align:center;
    letter-spacing:8px;
}

.verify-btn{
    width:100%;
    height:58px;
    margin-top:25px;
    border:0;
    border-radius:12px;
    background:#198754;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.verify-btn:hover{
    background:#146c43;
}

</style>


<div class="otp-container">

    <div class="otp-card">

        <h2 class="otp-title">
            <i class="fa fa-key"></i>
            Verify OTP
        </h2>

        <p class="otp-info">
            OTP has been sent to your registered email.
        </p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="otp"
                class="form-control"
                maxlength="6"
                placeholder="Enter 6 Digit OTP"
                required
            >

            <button type="submit" class="verify-btn">

                <i class="fa fa-check"></i>
                Verify OTP

            </button>

        </form>

    </div>

</div>


{% if messages %}

<script>

{% for message in messages %}

alert("{{ message|escapejs }}");

{% endfor %}

</script>

{% endif %}


{% endblock %}
