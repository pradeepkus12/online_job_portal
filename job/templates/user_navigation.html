<html>
    <head>
        {% load static %}
        <title> Job Portal </title>
     <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">  
  
<style>
    /* Header */

.header-section{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    padding:18px 0;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

/* Logo */

.logo-img{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #fff;
    transition:.4s;
}

.logo-img:hover{
    transform:scale(1.08);
}

/* Title */

.site-title{
    font-size:42px;
    font-weight:700;
    margin-bottom:8px;
}

.title-red{
    color:#ff4d4d;
}

.title-blue{
    color:#ffffff;
}

.site-subtitle{
    color:#e5e7eb;
    font-size:18px;
    letter-spacing:1px;
}

/* Social Icons */

.social{
    width:45px;
    height:45px;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    color:#fff;
    text-decoration:none;
    margin:0 6px;
    font-size:20px;
    transition:.4s;
}

.facebook{
    background:#1877F2;
}

.twitter{
    background:#1DA1F2;
}

.instagram{
    background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);
}

.linkedin{
    background:#0077B5;
}

.social:hover{
    transform:translateY(-6px) scale(1.12);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

/* Responsive */

@media(max-width:768px){

.logo-img{
    width:100px;
    height:100px;
    margin-bottom:15px;
}

.site-title{
    font-size:28px;
}

.site-subtitle{
    font-size:14px;
    margin-bottom:15px;
}

.social{
    width:40px;
    height:40px;
    font-size:18px;
}

}
.navbar-brand{
    margin-right: 150px;
}    

/* Navbar Brand */
.navbar-brand{
    font-size: 28px;
    font-weight: bold;
    color: #fff !important;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
}

/* Brand Icon */
.navbar-brand i{
    color: #ffc107;
    margin-right: 8px;
    transition: transform 0.3s ease;
}

/* Hover Effect */
.navbar-brand:hover{
    color: #ffc107 !important;
    text-shadow: 2px 2px 8px rgba(255,255,255,0.4);
}

.navbar-brand:hover i{
    transform: rotate(-10deg) scale(1.2);
}    
    /* Navbar Background */
.navbar {
    background: #fd0d4d;
}

/* Navbar Links */
.navbar-nav .nav-link {
    color: white !important;
    font-size: 17px;
    font-weight: 500;
    padding: 10px 18px;
    transition: all 0.3s ease;
    border-radius: 5px;
}

/* Hover Effect */
.navbar-nav .nav-link:hover {
    background-color: #ffffff;
    color: #0d6efd !important;
    transform: translateY(-2px);
}

/* Icon Hover */
.navbar-nav .nav-link i {
    margin-right: 6px;
    transition: transform 0.3s ease;
}

.navbar-nav .nav-link:hover i {
    transform: scale(1.2);
}

/* Active Menu */
 

</style>
    </head>

<body>

    <div class="container-fluid header-section">

    <div class="container">

        <div class="row align-items-center">

            <!-- Logo -->
            <div class="col-lg-3 col-md-3 text-center">
                <img src="{% static 'images/job-portal-1.jpg' %}"
                     class="logo-img"
                     alt="Job Portal Logo">
            </div>

            <!-- Website Name -->
            <div class="col-lg-6 col-md-6 text-center">

                <h1 class="site-title">
                    <span class="title-red">Online Job</span>
                    <span class="title-blue">Portal System</span>
                </h1>

                <p class="site-subtitle">
                    Find Your Dream Job | Hire Top Talent
                </p>

            </div>

            <!-- Social Icons -->
            <div class="col-lg-3 col-md-3 text-center">

                <a href="#" class="social facebook">
                    <i class="fa fa-facebook"></i>
                </a>

                <a href="#" class="social twitter">
                    <i class="fa fa-twitter"></i>
                </a>

                <a href="#" class="social instagram">
                    <i class="fa fa-instagram"></i>
                </a>

                <a href="#" class="social linkedin">
                    <i class="fa fa-linkedin"></i>
                </a>

            </div>

        </div>

    </div>

</div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mt-3">
        <div class="container">

            <a class="navbar-brand" href="{% url 'index' %}">Job Portal</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'user_home' %}" >
                            <i class="fa fa-home"></i> 
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'user_latestjobs' %}"  >
                            <i class="fa fa-search"></i>
                            Job list
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'change_passworduser' %}">
                           <i class="fa fa-key"></i>
                           Change Password
                         </a>
                   </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">
                           <i class="fa fa-sign-out"></i>
                         Logout
                         </a>
                   </li>

                   <li class="nav-item"> 
                 <span class="nav-link"> 
                  <i class="fa fa-user-circle"></i> {{ user.first_name }} {{ user.last_name }} </span> </li>
               

            
               </ul>
            </div>

        </div>
    </nav>

</body>
</html>
