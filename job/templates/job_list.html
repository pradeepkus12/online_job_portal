{% load static %}

{% block body %}

{% include 'recruiter_navigation.html' %}

<style>

/* =========================================================
   BODY
========================================================= */

body {
    margin: 0;
    padding: 0;
    background-color: #f4f7fc;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   PAGE HEADING
========================================================= */

.login-marquee {
    margin: 20px 15px;
    padding: 12px;

    background: linear-gradient(135deg, #0f172a, #198754);
    color: white;

    font-size: 20px;
    font-weight: bold;

    border-radius: 8px;

    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.20);

    letter-spacing: 1px;
}


/* =========================================================
   TABLE CONTAINER
========================================================= */

.table-container {
    width: 90%;
    margin: 30px auto;

    background-color: white;

    border-radius: 12px;

    overflow-x: auto;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}


/* =========================================================
   TABLE
========================================================= */

.job-table {
    width: 100%;

    border-collapse: collapse;

    background-color: white;
}


/* =========================================================
   TABLE HEADER
========================================================= */

.job-table thead {
    background: linear-gradient(135deg, #0f172a, #198754);

    color: white;
}


.job-table th {
    padding: 15px;

    text-align: center;

    font-size: 15px;

    white-space: nowrap;
}


/* =========================================================
   TABLE BODY
========================================================= */

.job-table td {
    padding: 14px;

    text-align: center;

    border-bottom: 1px solid #dddddd;

    font-size: 15px;
}


/* =========================================================
   TABLE HOVER
========================================================= */

.job-table tbody tr {
    transition: 0.3s;
}


.job-table tbody tr:hover {
    background-color: #f1f5f9;
}


/* =========================================================
   S.NO.
========================================================= */

.sno {
    font-weight: bold;

    color: #555555;
}


/* =========================================================
   JOB TITLE
========================================================= */

.job-title {
    font-weight: bold;

    color: #0d6efd;
}


/* =========================================================
   CREATION DATE
========================================================= */

.creation-date {
    font-weight: bold;

    color: #198754;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.action-buttons {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;
}


/* =========================================================
   EDIT BUTTON
========================================================= */

.btn-edit {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    padding: 8px 15px;

    background-color: #ffc107;

    color: #212529;

    border-radius: 6px;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;

    transition: 0.3s;
}


.btn-edit:hover {
    background-color: #e0a800;

    color: #000000;

    transform: translateY(-2px);
}


/* =========================================================
   DELETE BUTTON
========================================================= */

.btn-delete {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    padding: 8px 15px;

    background-color: #dc3545;

    color: white;

    border: none;

    border-radius: 6px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}


.btn-delete:hover {
    background-color: #b02a37;

    color: white;

    transform: translateY(-2px);
}


/* =========================================================
   NO DATA
========================================================= */

.no-data {
    padding: 30px !important;

    font-size: 18px !important;

    font-weight: bold;

    color: #6c757d;
}


/* =========================================================
   MOBILE RESPONSIVE
========================================================= */

@media (max-width: 768px) {

    .login-marquee {
        margin: 15px 10px;

        font-size: 16px;
    }


    .table-container {
        width: 95%;
    }


    .job-table th,
    .job-table td {
        padding: 10px 8px;

        font-size: 14px;
    }


    .action-buttons {
        flex-direction: column;

        gap: 5px;
    }


    .btn-edit,
    .btn-delete {
        width: 80px;
    }

}

</style>

<!-- =========================================================
     PAGE HEADING
========================================================= -->

<marquee class="login-marquee">


<i class="fa fa-briefcase"></i>

All Jobs


</marquee>

<hr>

<!-- =========================================================
     JOB TABLE
========================================================= -->

<div class="table-container">


<table class="job-table">


    <!-- ================= TABLE HEADER ================= -->

    <thead>

        <tr>

            <th>
                S.No.
            </th>

            <th>
                Job Title
            </th>

            <th>
                Creation Date
            </th>

            <th>
                Action
            </th>

        </tr>

    </thead>



    <!-- ================= TABLE BODY ================= -->

    <tbody>


        {% for i in data %}


        <tr>


            <!-- ================= S.NO. ================= -->

            <td class="sno">

                {{ forloop.counter }}

            </td>



            <!-- ================= JOB TITLE ================= -->

            <td class="job-title">

                {{ i.title }}

            </td>



            <!-- ================= CREATION DATE ================= -->

            <td class="creation-date">

                <i class="fa fa-calendar"></i>

                {{ i.creation_date }}

            </td>



            <!-- ================= ACTION ================= -->

            <td>


                <div class="action-buttons">


                    <!-- ================= EDIT ================= -->

                    <a href="{% url 'edit_jobdetail' i.id %}"
                       class="btn-edit">

                        <i class="fa fa-edit"></i>

                        Edit

                    </a>



                    <!-- ================= DELETE ================= -->

                    <form method="POST"
                          action="{% url 'delete_job' i.id %}"
                          onsubmit="return confirm('Are you sure you want to delete this job?');"
                          style="display: inline;">


                        {% csrf_token %}


                        <button type="submit"
                                class="btn-delete">

                            <i class="fa fa-trash"></i>

                            Delete

                        </button>


                    </form>


                </div>


            </td>


        </tr>


        {% empty %}


        <!-- ================= NO JOB ================= -->

        <tr>

            <td colspan="4"
                class="no-data">

                <i class="fa fa-info-circle"></i>

                No Jobs Found

            </td>

        </tr>


        {% endfor %}


    </tbody>


</table>


</div>

{% endblock %}
